spring.application.name=superdive-catalog
spring.datasource.url=jdbc:mysql://localhost:3306/grpc_cms?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# Port the gRPC server listens on. The backend's superdive.catalog.port must match.
spring.grpc.server.port=9091
# Currency for every price on the wire; the product table has no currency column.
superdive.catalog.currency=IDR
