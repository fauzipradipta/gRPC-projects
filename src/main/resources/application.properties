spring.application.name=superdive-catalog
spring.datasource.url=jdbc:mysql://localhost:3307/grpc_cms
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
# Port the gRPC server listens on. The backend's superdive.catalog.port must match.
spring.grpc.server.port=9090
# Currency for every price on the wire; the product table has no currency column.
superdive.catalog.currency=IDR
